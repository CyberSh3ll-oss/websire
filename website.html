<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEGIS — Threat Intelligence & Offensive Security</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy-950: #050d1a;
    --navy-900: #0a1628;
    --navy-800: #0f2040;
    --navy-700: #163058;
    --navy-600: #1e4080;
    --navy-400: #3b6cb0;
    --navy-200: #8aafd4;
    --navy-100: #c5d8ec;
    --navy-50:  #eaf1f8;

    --slate-900: #1a1d24;
    --slate-700: #2e333e;
    --slate-500: #4d5563;
    --slate-400: #6b7585;
    --slate-300: #9ca3af;
    --slate-200: #d1d5db;
    --slate-100: #e9eaec;
    --slate-50:  #f4f5f6;

    --crimson: #8b1a2e;
    --crimson-light: #d44a63;
    --crimson-faint: rgba(139, 26, 46, 0.18);

    --gold: #8a6e2f;
    --gold-light: #c9a84c;
    --gold-faint: rgba(201, 168, 76, 0.15);

    --white: #ffffff;

    /* Glass tokens */
    --glass-bg:        rgba(255, 255, 255, 0.07);
    --glass-bg-strong: rgba(255, 255, 255, 0.12);
    --glass-border:        rgba(255, 255, 255, 0.16);
    --glass-border-strong: rgba(255, 255, 255, 0.28);
    --glass-shadow:    0 8px 32px rgba(0, 0, 0, 0.35);
    --glass-shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
    --glass-blur: blur(24px) saturate(180%);
    --glass-blur-heavy: blur(40px) saturate(180%);

    --font-serif: 'EB Garamond', Georgia, serif;
    --font-sans: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;

    --radius: 20px;
    --radius-lg: 28px;
    --radius-xl: 36px;
  }

  html { scroll-behavior: smooth; font-size: 16px; }

  body {
    font-family: var(--font-sans);
    color: var(--navy-100);
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(1200px 800px at 12% 8%, rgba(30, 64, 128, 0.6), transparent 55%),
      radial-gradient(1000px 800px at 88% 15%, rgba(139, 26, 46, 0.45), transparent 55%),
      radial-gradient(900px 700px at 50% 100%, rgba(201, 168, 76, 0.28), transparent 60%),
      linear-gradient(160deg, #050d1a 0%, #0a1628 50%, #050d1a 100%);
    background-attachment: fixed;
    position: relative;
  }

  /* Ambient orbs */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(140px);
    pointer-events: none;
    z-index: 0;
    opacity: 0.55;
  }
  body::before {
    width: 560px; height: 560px; top: -140px; left: -120px;
    background: radial-gradient(circle, rgba(59,108,176,0.7), transparent 70%);
  }
  body::after {
    width: 520px; height: 520px; bottom: -160px; right: -100px;
    background: radial-gradient(circle, rgba(201,168,76,0.5), transparent 70%);
  }

  /* ── MODAL ───────────────────────────────────── */
  body.modal-open { overflow: hidden; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 13, 26, 0.55);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    opacity: 1;
    transition: opacity 0.4s ease;
  }
  .modal-overlay.hidden { opacity: 0; pointer-events: none; }

  .modal-content {
    background: rgba(15, 32, 64, 0.5);
    backdrop-filter: var(--glass-blur-heavy);
    -webkit-backdrop-filter: var(--glass-blur-heavy);
    border: 1px solid var(--glass-border-strong);
    border-radius: var(--radius-xl);
    max-width: 620px;
    width: 100%;
    box-shadow: var(--glass-shadow-lg),
                inset 0 1px 0 rgba(255,255,255,0.18),
                inset 0 -1px 0 rgba(255,255,255,0.05);
    transform: translateY(0) scale(1);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
    position: relative;
  }
  .modal-content::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--crimson), var(--gold-light), var(--crimson));
  }
  .modal-overlay.hidden .modal-content { transform: translateY(20px) scale(0.96); }

  .modal-header-bar {
    padding: 1.1rem 1.5rem;
    background: rgba(5, 13, 26, 0.35);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-title-text {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--crimson-light);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .modal-body-content { padding: 2rem 1.75rem; }

  .modal-text {
    font-family: var(--font-serif);
    font-size: 1.15rem;
    color: var(--navy-100);
    line-height: 1.65;
    margin-bottom: 1.25rem;
  }
  .modal-text strong { color: var(--gold-light); font-weight: 600; }

  .modal-footer-bar {
    padding: 1.25rem 1.75rem 1.5rem;
    border-top: 1px solid rgba(255,255,255,0.08);
    text-align: right;
    background: rgba(5, 13, 26, 0.25);
  }

  .modal-btn {
    background: rgba(201, 168, 76, 0.15);
    color: var(--gold-light);
    font-family: var(--font-mono);
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border: 1px solid rgba(201, 168, 76, 0.55);
    border-radius: 999px;
    padding: 0.75rem 1.75rem;
    cursor: pointer;
    transition: all 0.25s ease;
    backdrop-filter: blur(10px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
  }
  .modal-btn:hover {
    background: var(--gold-light);
    color: var(--navy-950);
    box-shadow: 0 8px 24px rgba(201, 168, 76, 0.4);
    transform: translateY(-1px);
  }

  /* ── SKIP LINK ───────────────────────────────── */
  .skip-link {
    position: absolute; top: -40px; left: 0;
    background: rgba(10,22,40,0.9);
    backdrop-filter: blur(10px);
    color: var(--white);
    padding: 8px 16px;
    z-index: 9999;
    font-size: 13px;
    border-radius: 0 0 8px 0;
    transition: top 0.2s;
  }
  .skip-link:focus { top: 0; }

  /* ── TOP STRIP ───────────────────────────────── */
  .top-strip {
    background: rgba(139, 26, 46, 0.35);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    color: var(--white);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-align: center;
    padding: 6px 1rem;
    position: relative;
    z-index: 10;
  }

  /* ── HEADER (sticky glass bar) ───────────────── */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10, 22, 40, 0.55);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border-bottom: 1px solid var(--glass-border);
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }

  .header-inner { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }

  .header-branding {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    padding: 1.1rem 0 1rem;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .header-seal {
    flex-shrink: 0;
    width: 68px;
    height: 68px;
    filter: drop-shadow(0 4px 16px rgba(201,168,76,0.35));
  }

  .header-title-block .agency-title {
    font-family: var(--font-serif);
    font-size: 2.5rem;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 0.22em;
    line-height: 1;
    text-shadow: 0 2px 24px rgba(201,168,76,0.3);
  }
  .header-title-block .agency-subtitle {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--navy-200);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 0.35rem;
  }

  .header-meta { margin-left: auto; text-align: right; }

  .header-meta .clearance-badge {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    color: var(--gold-light);
    background: rgba(201,168,76,0.1);
    border: 1px solid rgba(201,168,76,0.45);
    border-radius: 999px;
    padding: 4px 12px;
    text-transform: uppercase;
    backdrop-filter: blur(10px);
  }
  .header-meta .est-line {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.62rem;
    color: var(--slate-300);
    margin-top: 8px;
    letter-spacing: 0.08em;
  }

  /* ── NAV ──────────────────────────────────────── */
  .primary-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-links {
    display: flex;
    list-style: none;
    gap: 0.25rem;
    padding: 0.5rem 0;
  }

  .nav-links a {
    display: block;
    font-family: var(--font-sans);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--navy-200);
    text-decoration: none;
    padding: 0.55rem 1rem;
    border-radius: 999px;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .nav-links a:hover {
    color: var(--white);
    background: rgba(255,255,255,0.08);
  }

  .nav-cta {
    font-family: var(--font-mono) !important;
    font-size: 0.72rem !important;
    color: var(--gold-light) !important;
    border: 1px solid rgba(201,168,76,0.5);
    background: rgba(201,168,76,0.08);
    margin-left: 0.5rem;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .nav-cta:hover {
    background: var(--gold-light) !important;
    color: var(--navy-950) !important;
    box-shadow: 0 6px 20px rgba(201,168,76,0.35);
  }

  .nav-hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 0.85rem 0;
    background: none;
    border: none;
  }
  .nav-hamburger span {
    display: block;
    width: 22px;
    height: 2px;
    background: var(--navy-200);
    border-radius: 2px;
    transition: transform 0.25s, opacity 0.25s;
  }

  /* ── HERO ────────────────────────────────────── */
  .hero { padding: 3.5rem 2rem 3rem; position: relative; z-index: 1; }
  .hero-inner { max-width: 1200px; margin: 0 auto; }

  .hero-classification {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    color: var(--crimson-light);
    text-transform: uppercase;
    background: rgba(139,26,46,0.2);
    border: 1px solid rgba(212,74,99,0.5);
    border-radius: 999px;
    display: inline-block;
    padding: 5px 14px;
    margin-bottom: 1.75rem;
    backdrop-filter: blur(12px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .hero-main {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 2rem;
    align-items: stretch;
  }

  .hero-left, .hero-right {
    background: rgba(15, 32, 64, 0.4);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    padding: 2.5rem;
    box-shadow: var(--glass-shadow),
                inset 0 1px 0 rgba(255,255,255,0.12),
                inset 0 -1px 0 rgba(255,255,255,0.04);
    position: relative;
    overflow: hidden;
  }

  .hero-left::before {
    content: '';
    position: absolute;
    top: -50%; right: -30%;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(201,168,76,0.15), transparent 70%);
    pointer-events: none;
  }

  .hero-heading {
    font-family: var(--font-serif);
    font-size: 4rem;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 0.25em;
    line-height: 1;
    margin-bottom: 1rem;
    text-shadow: 0 4px 30px rgba(201,168,76,0.3);
  }

  .hero-tagline {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    letter-spacing: 0.16em;
    color: var(--gold-light);
    text-transform: uppercase;
    margin-bottom: 1.75rem;
    border-left: 2px solid var(--gold-light);
    padding-left: 0.8rem;
  }

  .hero-mission {
    font-family: var(--font-serif);
    font-size: 1.35rem;
    font-style: italic;
    color: var(--navy-100);
    line-height: 1.6;
    border-left: 3px solid var(--crimson-light);
    padding-left: 1.25rem;
  }

  .status-panel-title {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    color: var(--slate-300);
    text-transform: uppercase;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 0.85rem;
    margin-bottom: 1rem;
  }

  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    padding: 0.6rem 0.5rem;
    border-radius: 10px;
    color: var(--navy-200);
    transition: background 0.2s;
  }
  .status-row:hover { background: rgba(255,255,255,0.05); }

  .status-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    margin-right: 10px;
    vertical-align: middle;
  }
  .status-dot.green { background: #4caf50; box-shadow: 0 0 8px #4caf50, 0 0 2px #4caf50; }
  .status-dot.amber { background: var(--gold-light); box-shadow: 0 0 8px var(--gold-light); }
  .status-dot.red   { background: var(--crimson-light); box-shadow: 0 0 8px var(--crimson-light); }

  .status-val { color: var(--white); letter-spacing: 0.05em; font-weight: 500; }

  /* ── SECTION SHELL ───────────────────────────── */
  .section-block {
    padding: 3rem 2rem;
    position: relative;
    z-index: 1;
  }
  .section-inner { max-width: 1200px; margin: 0 auto; }

  .section-eyebrow {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    letter-spacing: 0.22em;
    color: var(--crimson-light);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }
  .section-heading {
    font-family: var(--font-serif);
    font-size: 2.1rem;
    font-weight: 700;
    color: var(--white);
    margin-bottom: 0.5rem;
    line-height: 1.15;
    text-shadow: 0 2px 20px rgba(0,0,0,0.4);
  }
  .section-rule {
    width: 48px;
    height: 3px;
    background: linear-gradient(90deg, var(--gold-light), var(--crimson-light));
    margin-bottom: 1.75rem;
    border: none;
    border-radius: 3px;
  }
  .section-lead {
    font-size: 1rem;
    color: var(--navy-200);
    max-width: 680px;
    margin-bottom: 2.25rem;
    line-height: 1.75;
  }

  /* ── SERVICES ────────────────────────────────── */
  .services-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1.25rem;
  }
  .service-card {
    background: rgba(15, 32, 64, 0.42);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    padding: 1.75rem 1.5rem;
    position: relative;
    overflow: hidden;
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
  }
  .service-card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent 40%);
    pointer-events: none;
  }
  .service-card:hover {
    transform: translateY(-4px);
    border-color: rgba(201,168,76,0.45);
    box-shadow: 0 20px 40px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.15);
  }

  .service-icon {
    width: 48px; height: 48px;
    background: rgba(201,168,76,0.12);
    border: 1px solid rgba(201,168,76,0.35);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.25rem;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .service-icon svg {
    width: 22px; height: 22px;
    stroke: var(--gold-light);
    fill: none;
    stroke-width: 1.6;
  }
  .service-code {
    font-family: var(--font-mono);
    font-size: 0.62rem;
    color: var(--slate-300);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }
  .service-name {
    font-family: var(--font-serif);
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--white);
    margin-bottom: 0.75rem;
    line-height: 1.2;
  }
  .service-desc {
    font-size: 0.85rem;
    color: var(--navy-200);
    line-height: 1.65;
  }

  /* ── DIRECTIVE ───────────────────────────────── */
  .directive-block .section-eyebrow { color: var(--gold-light); }

  .directive-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    align-items: start;
  }
  .directive-text {
    font-family: var(--font-serif);
    font-size: 1.1rem;
    font-style: italic;
    color: var(--navy-100);
    line-height: 1.8;
    padding: 1.75rem;
    background: rgba(15, 32, 64, 0.42);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border);
    border-left: 3px solid var(--gold-light);
    border-radius: var(--radius-lg);
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .directive-checklist {
    list-style: none;
    background: rgba(15, 32, 64, 0.42);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    padding: 1.25rem 1.5rem;
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .directive-checklist li {
    display: flex;
    gap: 0.75rem;
    font-size: 0.88rem;
    color: var(--navy-100);
    padding: 0.75rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    line-height: 1.55;
  }
  .directive-checklist li:last-child { border-bottom: none; }
  .directive-checklist li strong { color: var(--gold-light); font-weight: 600; }

  .check-mark {
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--gold-light);
    margin-top: 2px;
  }

  /* ── INTEL FEED ──────────────────────────────── */
  .intel-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
  }
  .intel-card {
    background: rgba(15, 32, 64, 0.42);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .intel-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 20px 44px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .intel-header {
    background: rgba(5, 13, 26, 0.4);
    backdrop-filter: blur(10px);
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .intel-classification-tag {
    font-family: var(--font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    color: var(--crimson-light);
    border: 1px solid rgba(212,74,99,0.55);
    background: rgba(139,26,46,0.18);
    border-radius: 999px;
    padding: 3px 10px;
    text-transform: uppercase;
    backdrop-filter: blur(8px);
  }
  .intel-id {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    color: var(--slate-300);
    letter-spacing: 0.1em;
